name: Sync README Skills Table

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    container: 'evindunn/python3:latest'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate README table
        run: python update_readme_table.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync README skills table"
          git push
